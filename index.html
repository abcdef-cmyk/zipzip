<meta name="theme-color" content="#74A12E">
<title>Zip Zip · Pago</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Glacial+Indifference&display=swap');
:root{--green:#74A12E;--dark:#3E4939;--cream:#FAF9F1;--soft:#F1F4E9;--white:#fff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px 18px;display:flex;justify-content:center;align-items:center;background:var(--cream);color:var(--dark);font-family:"Glacial Indifference",Arial,sans-serif}
.card{width:100%;max-width:430px;background:var(--white);border-radius:30px;padding:25px 24px 28px;box-shadow:0 14px 45px rgba(64,82,38,.10);text-align:center}
.logo{display:block;width:min(250px,78%);height:auto;margin:0 auto 18px}
h1{margin:2px 0 4px;color:var(--green);font-size:30px;line-height:1.05;font-weight:700}
.subtitle{margin:0 0 23px;font-size:15px;letter-spacing:3px;text-transform:uppercase;color:var(--green)}
.details{background:var(--soft);border-radius:22px;padding:8px 19px;text-align:left;margin-bottom:18px}
.detail{padding:14px 0;border-bottom:1px solid rgba(116,161,46,.18)}
.detail:last-child{border-bottom:0}
.label{display:block;color:var(--green);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:5px}
.value{display:block;font-size:18px;line-height:1.3}
.clabe{font-size:19px;letter-spacing:1.1px;word-break:break-all}
button{width:100%;padding:16px 18px;border:0;border-radius:999px;background:var(--green);color:white;font-family:inherit;font-size:17px;font-weight:700;letter-spacing:1px;cursor:pointer}
button:active{transform:scale(.98)}
.success{min-height:42px;padding-top:10px;color:var(--green);font-size:14px;line-height:1.4}
.proof{margin-top:13px;padding:17px;border:2px solid var(--green);border-radius:22px;line-height:1.45}
.proof-title{color:var(--green);font-size:18px;font-weight:700;margin-bottom:3px}
.handle{display:inline-block;color:var(--green);font-weight:700;text-decoration:none}.handle:hover{text-decoration:underline}
.thanks{margin:20px 0 0;color:var(--green);font-size:12px;font-weight:700;letter-spacing:2.4px;text-transform:uppercase}
.note{margin:14px 5px 0;font-size:11px;opacity:.58;line-height:1.4}
@media(max-width:380px){.card{padding-left:18px;padding-right:18px}.clabe{font-size:17px;letter-spacing:.7px}}
</style>
</head>
