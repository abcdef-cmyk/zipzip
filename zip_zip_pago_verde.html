<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zip Zip · Pago</title>

  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Glacial+Indifference&family=Lazy+Dog&display=swap" rel="stylesheet">

  <style>
    :root {
      --zip-green: #74A12E;
      --zip-dark: #33451A;
      --zip-cream: #F8F7F0;
      --zip-white: #FFFFFF;
      --zip-soft: #EEF3E4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--zip-cream);
      color: var(--zip-dark);
      font-family: "Glacial Indifference", Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: var(--zip-white);
      border-radius: 28px;
      padding: 34px 26px 28px;
      box-shadow: 0 14px 40px rgba(51, 69, 26, 0.12);
      text-align: center;
    }

    .logo {
      margin: 0 0 8px;
      color: var(--zip-green);
      font-family: "Lazy Dog", cursive;
      font-size: 52px;
      line-height: 1;
      letter-spacing: 0.5px;
    }

    .subtitle {
      margin: 0 0 28px;
      font-size: 18px;
      line-height: 1.35;
    }

    .details {
      background: var(--zip-soft);
      border-radius: 20px;
      padding: 18px;
      text-align: left;
      margin-bottom: 18px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding: 8px 0;
      font-size: 16px;
    }

    .label {
      opacity: 0.7;
    }

    .value {
      font-weight: 600;
      text-align: right;
    }

    .clabe-box {
      margin: 18px 0;
      padding: 18px;
      border: 2px dashed var(--zip-green);
      border-radius: 18px;
      background: #FCFDF9;
    }

    .clabe-label {
      margin-bottom: 7px;
      font-size: 14px;
      opacity: 0.7;
    }

    .clabe {
      font-size: 21px;
      letter-spacing: 1.2px;
      font-weight: 600;
      word-break: break-all;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 16px 20px;
      background: var(--zip-green);
      color: white;
      font-family: "Glacial Indifference", Arial, sans-serif;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      opacity: 0.92;
    }

    button:active {
      transform: scale(0.98);
    }

    .success {
      min-height: 24px;
      margin-top: 12px;
      color: var(--zip-green);
      font-size: 15px;
      font-weight: 600;
    }

    .whatsapp {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #E4E8DC;
      font-size: 15px;
      line-height: 1.5;
    }

    .whatsapp strong {
      color: var(--zip-green);
    }

    .note {
      margin: 18px 0 0;
      font-size: 12px;
      line-height: 1.5;
      opacity: 0.6;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1 class="logo">Zip Zip ✦</h1>

    <p class="subtitle">Paga tu pedido por transferencia</p>

    <section class="details">
      <div class="row">
        <span class="label">Banco</span>
        <span class="value">STP</span>
      </div>

      <div class="row">
        <span class="label">Titular</span>
        <span class="value">América González Yáñez</span>
      </div>
    </section>

    <section class="clabe-box">
      <div class="clabe-label">CLABE interbancaria</div>
      <div class="clabe" id="clabe">646990404051677112</div>
    </section>

    <button id="copyButton" type="button" onclick="copyClabe()">
      Copiar CLABE
    </button>

    <div class="success" id="successMessage" aria-live="polite"></div>

    <div class="whatsapp">
      ¿Necesitas enviar tu comprobante?<br>
      WhatsApp: <strong>@ameeglz</strong>
    </div>

    <p class="note">
      Antes de confirmar tu transferencia, verifica que los datos del destinatario sean correctos.
    </p>
  </main>

  <script>
    async function copyClabe() {
      const clabe = document.getElementById("clabe").textContent.trim();
      const button = document.getElementById("copyButton");
      const message = document.getElementById("successMessage");

      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(clabe);
        } else {
          const textarea = document.createElement("textarea");
          textarea.value = clabe;
          textarea.style.position = "fixed";
          textarea.style.left = "-9999px";
          document.body.appendChild(textarea);
          textarea.focus();
          textarea.select();
          document.execCommand("copy");
          textarea.remove();
        }

        button.textContent = "✓ CLABE copiada";
        message.textContent = "Ya puedes pegarla en tu app bancaria.";

        setTimeout(() => {
          button.textContent = "Copiar CLABE";
          message.textContent = "";
        }, 3000);

      } catch (error) {
        message.textContent = "No se pudo copiar automáticamente. Mantén presionada la CLABE para copiarla.";
      }
    }
  </script>
</body>
</html>
